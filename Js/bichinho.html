<!DOCTYPE html>
<html lang="pt-BR">
<!--Mexer com o daisy UI tava dando muita dor de cabeça, fazer na mão é melhor pra mim.-->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bichinho</title>
  <style>
    body {
      background-position: top;
      background-repeat: no-repeat;
      background-size: cover;

    }

    #Avatar {
      display: flex;
      height: 100px;
      border: 3px solid transparent;
      border-radius: 50%;
      background-image: linear-gradient(white, white), linear-gradient(45deg, orange, red);
      background-origin: border-box;
      background-clip: padding-box, border-box;
    }

    .perfil {
      display: flex;
      width: fit-content;
      align-items: center;
    }

    .NomeDoBixo {
      border: 3px solid transparent;
      border-radius: 5px;
      background-image: linear-gradient(white, white), linear-gradient(45deg, orange, red);
      background-origin: border-box;
      background-clip: padding-box, border-box;
      font-size: x-large
    }

    .pikomon {
      display: flex;
      justify-self: right;
      position: relative;
      margin-right: 50%;
      align-items: baseline;
      justify-content: baseline;
      bottom: -290px;
    }

    #berry {
      height: 100px;
      transition: transform 0.2s ease-in-out;
    }

    #berry:hover {
      transform: scale(1.1);
    }

    /*Cortesia do chatGPT*/
    #berry:active {
      animation: pulse 0.3s ease;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.2);
      }

      100% {
        transform: scale(1);
      }
    }

    #troca {
      transition: opacity 0.5s ease;

    }

    .aumenta {
      transition: transform 0.2s ease-in-out;
    }

    .fade-out {
      opacity: 0;
    }

    .aumenta:hover {
      transform: scale(1.1);
    }

    /* Coisa do chat*/
    #bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;

      background-size: cover;
      background-position: top;

      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .ponto {
      position: fixed;
      width: 8px;
      height: 8px;
      background: yellow;
      border-radius: 50%;
      pointer-events: none;

      opacity: 0;
      animation: aparecer 2s ease forwards;
    }

    @keyframes aparecer {
      0% {
        opacity: 0;
        transform: scale(0.5);
      }

      50% {
        opacity: 1;
        transform: scale(1.2);
      }

      100% {
        opacity: 0;
        transform: scale(0.5);
      }
    }
  </style>
</head>

<body>
  <audio id="somgnomo" src="Gnome.mp3"></audio>
  <div id="bg-overlay"></div><!--Coisa do chat-->
  <div class="perfil">
    <img class="aumenta"src="avatar.png" id="Avatar" style="margin-right: 20px;" onclick="tocagnomo()"/>
    <input type="text" placeholder="Nome da criatura..." class="NomeDoBixo" />
  </div>

  <div class="pikomon">
    <img id="normar" src="Normal.png" style="position: absolute; width: 360px; bottom: 0; left: 50%;" />
  </div>
  <div style="display:grid;">
    <img id="berry" src="berry.webp" alt="Botão" onclick="alimentar()" />
    <img class="aumenta" id="troca" src="Sol.png" alt="BotaoDia/Noite" style="width: 100px;" onclick="passarTempo()">
  </div>

</body>
<script src="cabeca.js">

</script>

</html>
